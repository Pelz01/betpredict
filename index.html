<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>BetPredict | AI-Powered Sports Betting Edge Finder</title>
  <meta name="description"
    content="Find profitable betting edges with AI-powered Expected Value analysis. BetPredict prioritizes EV over raw probability—find where the edge is, not just who will win." />
  <meta name="keywords"
    content="sports betting, expected value, EV, kelly criterion, betting predictions, AI betting" />

  <!-- Open Graph -->
  <meta property="og:title" content="BetPredict | AI Sports Betting Edge Finder" />
  <meta property="og:description" content="Find profitable betting edges with AI-powered Expected Value analysis." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts - Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Theme Initialization -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', savedTheme || systemTheme);
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
